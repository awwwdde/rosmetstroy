<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="Направления: металлоконструкции, отделка, логистика, IT-решения через партнёра">
  <style>
    .t { font-family: Onest, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .card { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .c1 { animation-delay: .1s } .c2 { animation-delay: .25s } .c3 { animation-delay: .4s } .c4 { animation-delay: .55s }
    @keyframes up { from { opacity: 0; transform: translateY(22px) } to { opacity: 1; transform: none } }
    .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s .8s cubic-bezier(.45,.05,.25,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .sweep { animation: sweep 3.6s 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes sweep { 0%, 100% { transform: scaleX(.18) } 50% { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) { .card { opacity: 1; animation: none } .draw { stroke-dashoffset: 0; animation: none } .sweep { animation: none } }
  </style>

  <!-- 01 — основное направление -->
  <g class="card c1">
    <rect x="1" y="1" width="508" height="256" rx="6" fill="#071D36"/>
    <text class="t" x="32" y="52" fill="#A9D4FF" font-size="14" font-weight="500" letter-spacing="2">01 · ОСНОВНОЕ НАПРАВЛЕНИЕ</text>
    <text class="t" x="32" y="104" fill="#FFFFFF" font-size="34" font-weight="600" letter-spacing="-1">Металлоконструкции</text>
    <text class="t" x="32" y="146" fill="#A9D4FF" font-size="17">Проектирование КМ/КМД, изготовление</text>
    <text class="t" x="32" y="172" fill="#A9D4FF" font-size="17">по чертежам и монтаж на объекте</text>
    <rect class="sweep" x="32" y="214" width="190" height="4" rx="2" fill="#087CFF"/>
    <g transform="translate(388 112) scale(.75)">
      <path class="draw" pathLength="1" d="M0 150 V70 L75 30 L150 70 V150 M0 70 H150 M37.5 70 V50 M75 70 V30 M112.5 70 V50 M0 70 L37.5 50 M37.5 70 L75 30 L112.5 70 M112.5 50 L150 70" stroke="#3B6A9E" stroke-width="3"/>
    </g>
  </g>

  <g class="card c2">
    <rect x="528" y="1" width="244" height="256" rx="6" fill="#F5F8FB" stroke="#CBD6E2"/>
    <text class="t" x="556" y="52" fill="#326FA7" font-size="14" font-weight="500" letter-spacing="2">02</text>
    <text class="t" x="556" y="104" fill="#071D36" font-size="26" font-weight="600" letter-spacing="-.5">Отделка</text>
    <text class="t" x="556" y="144" fill="#4A5866" font-size="15">Внутренняя отделка</text>
    <text class="t" x="556" y="166" fill="#4A5866" font-size="15">офисов, коммерческих</text>
    <text class="t" x="556" y="188" fill="#4A5866" font-size="15">и складских помещений</text>
  </g>

  <g class="card c3">
    <rect x="790" y="1" width="244" height="256" rx="6" fill="#F5F8FB" stroke="#CBD6E2"/>
    <text class="t" x="818" y="52" fill="#326FA7" font-size="14" font-weight="500" letter-spacing="2">03</text>
    <text class="t" x="818" y="104" fill="#071D36" font-size="26" font-weight="600" letter-spacing="-.5">Логистика</text>
    <text class="t" x="818" y="144" fill="#4A5866" font-size="15">Доставка холодильного</text>
    <text class="t" x="818" y="166" fill="#4A5866" font-size="15">и вентиляционного</text>
    <text class="t" x="818" y="188" fill="#4A5866" font-size="15">оборудования</text>
  </g>

  <g class="card c4">
    <rect x="1052" y="1" width="227" height="256" rx="6" fill="#FFFFFF" stroke="#CBD6E2" stroke-dasharray="6 5"/>
    <text class="t" x="1078" y="52" fill="#326FA7" font-size="14" font-weight="500" letter-spacing="2">04 · ПАРТНЁР</text>
    <text class="t" x="1078" y="104" fill="#071D36" font-size="26" font-weight="600" letter-spacing="-.5">IT-решения</text>
    <text class="t" x="1078" y="144" fill="#4A5866" font-size="15">Сайты и веб-сервисы</text>
    <text class="t" x="1078" y="166" fill="#4A5866" font-size="15">через партнёрскую</text>
    <text class="t" x="1078" y="188" fill="#4A5866" font-size="15">студию разработки</text>
  </g>
</svg>
