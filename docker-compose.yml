# Production: docker compose up -d --build
# Переменные — в файле .env рядом с этим файлом (шаблон: .env.example).
name: rosmetstroy

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env}
  SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  CORS_ORIGINS: ${NEXT_PUBLIC_SITE_URL}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  FRONTEND_INTERNAL_URL: http://frontend:3000
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Задайте REVALIDATE_SECRET в .env}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  NOTIFY_EMAILS: ${NOTIFY_EMAILS:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Порт PostgreSQL наружу не публикуется

  backend:
    build: ./back
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - media:/data/media
      - private_files:/data/private
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./front
      args:
        API_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  media:
  private_files:
  caddy_data:
  caddy_config:
